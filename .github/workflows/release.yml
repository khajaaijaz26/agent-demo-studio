name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ffmpeg
      - run: npm run test:creator
      - run: mkdir -p release-artifacts && npm pack --pack-destination release-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.ref_name }}
          path: release-artifacts/*.tgz
      - name: Create GitHub release and attach package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "Agent Demo Studio $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release-artifacts/*.tgz --clobber
